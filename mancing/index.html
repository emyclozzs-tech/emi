.bgshade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,32,31,0) 0%,rgba(4,32,31,.1) 38%,rgba(4,32,31,.8) 58%,rgba(4,32,31,.95) 80%)}
.cover{position:relative;height:470px;overflow:hidden}
.cover .ray{display:none;position:absolute;top:-40px;width:60px;height:340px;background:linear-gradient(180deg,rgba(220,255,245,.22),transparent);transform:rotate(18deg);filter:blur(6px)}
.bubble{position:absolute;bottom:-20px;border-radius:50%;border:1px solid rgba(220,255,245,.45);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-300px);opacity:0}}
.waves{position:absolute;left:0;bottom:-1px;width:200%;height:70px;animation:drift 9s linear infinite}
.waves.w2{height:56px;animation-duration:14s;opacity:.55}
@keyframes drift{to{transform:translateX(-50%)}}
.body{padding:0 18px 40px;margin-top:-58px;position:relative;z-index:2;text-align:center}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto;overflow:hidden;border:3px solid var(--mint);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(95,224,192,.45),0 12px 30px rgba(0,0,0,.35)}
.av svg{width:50px;height:50px;color:#eafff9}
h1{font-family:"Space Grotesk",sans-serif;font-size:28px;margin-top:14px;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.bio{color:#ffffff;font-size:14px;font-weight:500;margin-top:8px;line-height:1.5;text-shadow:0 1px 2px rgba(0,0,0,.9),0 2px 12px rgba(0,0,0,.75)}
.bio b{color:var(--mint)}
.socials{display:flex;justify-content:center;gap:10px;margin-top:18px}
.socials a{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);transition:.2s}
.socials a:hover{border-color:var(--mint);color:var(--mint);transform:translateY(-2px)}
.socials svg{width:20px;height:20px}
.label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.links{display:flex;flex-direction:column;gap:10px;text-align:left}
.feat{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(23,165,137,.45),rgba(13,63,67,.8));border:1px solid var(--line-hi);color:var(--text);text-decoration:none;transition:.2s}
.feat:hover{transform:translateY(-2px);border-color:var(--mint)}
.feat .th{width:84px;height:118px;border-radius:12px;flex:none;background:linear-gradient(160deg,#1a6b66,#0b3b3e);display:grid;place-items:center;position:relative;overflow:hidden}
.feat .th svg{width:34px;height:34px;color:rgba(230,251,246,.55)}
.feat .pl{position:absolute;width:36px;height:36px;border-radius:50%;background:var(--mint);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(95,224,192,.2)}
.feat .pl svg{width:15px;height:15px;color:#04201f;margin-left:2px}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);background:rgba(95,224,192,.12);border:1px solid rgba(95,224,192,.3);padding:4px 9px;border-radius:99px}
.feat h2{font-family:"Space Grotesk",sans-serif;font-size:19px;margin-top:8px;line-height:1.2}
.feat p{font-size:13px;color:var(--muted);margin-top:5px}
.row{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;transition:.2s}
.row:hover{background:var(--card-hi);border-color:var(--line-hi);transform:translateY(-1px)}
.row .ic{width:40px;height:40px;border-radius:12px;background:rgba(95,224,192,.12);display:grid;place-items:center;flex:none;color:var(--mint)}
.row .ic svg{width:20px;height:20px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .ar{color:var(--muted)}
.tt{border-radius:18px;overflow:hidden;border:1px solid var(--line-hi);background:var(--card)}
.tt blockquote{margin:0!important}
footer{margin-top:30px;font-size:12px;color:#3f6f68}
.bottomwave{display:block;width:100%;height:40px;margin-top:20px;opacity:.35}
</style>
</head>
