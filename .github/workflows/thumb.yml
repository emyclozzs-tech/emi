name: Refresh thumbnail video terbaru
on:
  push:
    paths: ["mancing/latest.json", ".github/workflows/thumb.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cover from TikTok oEmbed
        run: |
          URL=$(jq -r .url mancing/latest.json)
          FULL=$(curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" -o /dev/null -w '%{url_effective}' "$URL" || true)
          echo "resolved: $FULL"
          R=$(curl -sSL -A "Mozilla/5.0" "https://www.tiktok.com/oembed?url=${URL}" || true)
          echo "oembed: ${R:0:600}"
          T=$(jq -r '.cover // empty' mancing/latest.json)
          [ -z "$T" ] && T=$(echo "$R" | jq -r '.thumbnail_url // empty')
          if [ -z "$T" ]; then
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" "$FULL" -o /tmp/page.html || true
            echo "page bytes: $(wc -c < /tmp/page.html)"
            python3 - <<'PY' > /tmp/meta.txt
          import re,html,json
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          def m(p):
              r=re.search(p,s); return html.unescape(r.group(1)) if r else ''
          img=m(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"') or json.loads('"'+m(r'"(?:originCover|cover)":"(https:[^"]+)"')+'"') if (m(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"') or m(r'"(?:originCover|cover)":"(https:[^"]+)"')) else ''
          desc=m(r'<meta[^>]+property="og:description"[^>]+content="([^"]*)"') or m(r'"desc":"([^"]*)"')
          print(img); print(desc)
          PY
            cat /tmp/meta.txt | head -c 600; echo
            T=$(sed -n 1p /tmp/meta.txt)
          fi
          curl -fsSL -A "Mozilla/5.0" "$T" -o /tmp/t.img
          pip install -q pillow
          python3 -c "from PIL import Image; im=Image.open('/tmp/t.img').convert('RGB'); w=240; im.resize((w,int(im.height*w/im.width))).save('mancing/thumb.jpg','JPEG',quality=80)"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mancing/thumb.jpg
          git diff --cached --quiet || (git commit -m "Update thumbnail video terbaru" && git push)
