<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contoh widget TikTok</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#04201f;color:#e6fbf6;display:flex;justify-content:center;padding:24px 14px}
main{width:100%;max-width:440px}
h1{font-size:20px;margin:0 0 4px}
p{color:#8fcfc1;font-size:14px;margin:0 0 18px}
.label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8fcfc1;margin:26px 4px 10px}
.box{border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<main>
  <h1>Contoh widget TikTok</h1>
  <p>Ini rupa sebenar widget profil TikTok. Video kat dalam ni update sendiri bila ada video baru.</p>

  <div class="label">Emi Mancing (@emimancing)</div>
  <div class="box">
    <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@emimancing" data-unique-id="emimancing" data-embed-type="creator" style="max-width:780px;min-width:288px;margin:0"><section><a target="_blank" href="https://www.tiktok.com/@emimancing?refer=creator_embed">@emimancing</a></section></blockquote>
  </div>

  <div class="label">EmiMohamad (@emimohamad)</div>
  <div class="box">
    <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@emimohamad" data-unique-id="emimohamad" data-embed-type="creator" style="max-width:780px;min-width:288px;margin:0"><section><a target="_blank" href="https://www.tiktok.com/@emimohamad?refer=creator_embed">@emimohamad</a></section></blockquote>
  </div>
</main>
<script async src="https://www.tiktok.com/embed.js"></script>
</body>
</html>
